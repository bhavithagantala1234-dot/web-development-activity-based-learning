
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2 class="logo">LearnHub</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="instructors.html">Instructors</a>
        <a href="learning.html">My Learning</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-heading">
    <h1>Contact Us</h1>
    <p>Send us your questions and suggestions.</p>
</section>

<section class="section">
    <div class="contact-box">
        <h2>Get in Touch</h2>
        <p>Fill in the form below.</p>

        <form id="contactForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="topic">Subject</label>
            <select id="topic" required>
                <option value="">Select a subject</option>
                <option>Course Enquiry</option>
                <option>Technical Support</option>
                <option>Feedback</option>
                <option>Other</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Write your message" required></textarea>

            <button type="submit" class="btn">Send Message</button>
            <p id="formMessage" class="success-message"></p>
        </form>
    </div>
</section>

<footer><p>© 2026 LearnHub | Online Learning Platform</p></footer>
<script src="script.js"></script>
</body>
</html>
